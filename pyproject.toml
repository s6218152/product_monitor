[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-product-monitor"
version = "0.1.0"
description = "Fixture-first Facebook product monitoring MVP"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
facebook = ["playwright>=1.55"]

[project.scripts]
facebook-product-monitor = "app.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
